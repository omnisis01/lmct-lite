<!doctype html>
<!-- 이투스247 웹 방문자용 1분 학습진단(LMCT 라이트)과 응답 로그 전송 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이투스247 LMCT 학습진단</title>
<meta name="description" content="공부 빈틈 3분 진단. 2028 수능에서 새로 공부할 부분과 나에게 맞는 학습 방법을 바로 확인하세요.">
<style>
@font-face { font-family: 'Pretendard'; src: url('fonts/PretendardVariable.woff2') format('woff2-variations'), url('fonts/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; font-display: swap; }
/* 이천기숙 LMCT(/quick)와 같은 BI: 청록에서 연두로 이어지는 그라데이션, 흰 카드, 모바일 우선 */
:root {
  color-scheme: light;
  --teal-deep: #0A5F5C; --teal: #0E7C77; --teal-bright: #13A89E; --green: #7CC242; --lime: #A5D34A;
  --ink: #1F2325; --ink-soft: #1F2325; --ink-mute: #1F2325;
  --hot: #F26B3A; --hot-soft: #FFF1EA;
  --line: #E4EBE8; --line-soft: #EFF4F1; --paper: #F6F8F7;
  --grad-bi: linear-gradient(135deg, #0E7C77 0%, #13A89E 45%, #7CC242 100%);
  --grad-bi-soft: linear-gradient(135deg, #EAF6F4 0%, #F1F9EC 100%);
  --grad-dark: linear-gradient(150deg, #0A5F5C 0%, #0E7C77 55%, #127F6E 100%);
  --sh-sm: 0 1px 3px rgba(10, 40, 38, .05); --sh-md: 0 4px 16px rgba(10, 60, 56, .07); --sh-lg: 0 14px 38px rgba(10, 60, 56, .11);
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 19px; line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid rgba(14, 124, 119, .35); outline-offset: 2px; }

.shell { max-width: 600px; margin: 0 auto; padding: 0 16px 48px; }
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 11px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo { display: flex; align-items: baseline; gap: 5px; font-weight: 900; letter-spacing: -.5px; }
.brand .logo b { font-size: 25px; color: var(--ink); }
.brand .logo span { font-size: 25px; color: var(--teal); }
.brand .sys { font-size: 12px; font-weight: 800; color: var(--ink-mute); line-height: 1.25; white-space: nowrap; border-left: 1px solid var(--line); padding-left: 10px; }
.brand .sys b { display: block; color: var(--teal); font-weight: 900; }
.back { border: 1px solid var(--line); background: #fff; color: var(--ink-soft); border-radius: 9px; padding: 7px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.back:hover { border-color: var(--teal); color: var(--teal); }

.screen { animation: rise .3s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .spinner { animation: none !important; } }

.hero { position: relative; overflow: hidden; background: var(--grad-dark); border-radius: 24px; margin: 18px 0 14px; padding: 28px 22px 24px; color: #fff; box-shadow: var(--sh-lg); }
.hero::before { content: ""; position: absolute; right: -70px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(124, 194, 66, .55) 0%, rgba(124, 194, 66, 0) 68%); }
.hero::after { content: ""; position: absolute; left: -50px; bottom: -100px; width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle, rgba(19, 168, 158, .5) 0%, rgba(19, 168, 158, 0) 70%); }
.hero > * { position: relative; z-index: 1; }
.kicker { display: inline-flex; align-items: center; gap: 7px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .24); border-radius: 999px; padding: 6px 14px; font-size: 14.5px; font-weight: 800; letter-spacing: .02em; margin-bottom: 16px; }
.kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
.hero h1 { font-size: 33px; font-weight: 900; line-height: 1.28; letter-spacing: -.9px; margin: 0 0 10px; }
.hero h1 em, .res-hero h2 em { font-style: normal; background: linear-gradient(120deg, #C6F07E 0%, #7CC242 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { font-size: 17.5px; line-height: 1.62; opacity: .88; margin: 0; }

.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; margin-bottom: 13px; box-shadow: var(--sh-sm); }
.card-head { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 900; color: var(--teal-deep); letter-spacing: -.35px; margin: 0 0 3px; }
.card-sub { font-size: 15px; color: var(--ink-mute); margin: 0 0 15px; line-height: 1.55; }
.values { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.value { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; background: var(--grad-bi-soft); border: 1px solid #DCEDE4; border-radius: 14px; padding: 13px 14px; }
.value .ico { width: 48px; height: 48px; border-radius: 12px; background: var(--grad-bi); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 900; box-shadow: 0 4px 12px rgba(14, 124, 119, .28); }
.value h3 { font-size: 17px; font-weight: 900; margin: 0 0 2px; letter-spacing: -.25px; }
.value p { font-size: 14.5px; color: var(--ink-soft); margin: 0; line-height: 1.48; }
.value p b { color: var(--teal); font-weight: 900; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 13px; padding: 15px 22px; font-size: 19px; font-weight: 900; letter-spacing: -.2px; text-decoration: none; transition: transform .09s, box-shadow .16s, opacity .15s; width: 100%; }
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--grad-bi); color: #fff; box-shadow: 0 8px 22px rgba(14, 124, 119, .3); }
.btn-ghost { background: #fff; color: var(--ink-soft); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.hint { display: flex; align-items: flex-start; gap: 7px; font-size: 14.5px; color: var(--ink-mute); line-height: 1.55; margin: 12px 0 0; }
.hint::before { content: "i"; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 11px; font-weight: 900; display: grid; place-items: center; margin-top: 2px; }
.foot { text-align: center; font-size: 14px; color: var(--ink-mute); line-height: 1.7; margin-top: 22px; }
.foot b { color: var(--teal-deep); }

.progress { padding: 16px 0 6px; }
.progress-top { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; font-weight: 800; color: var(--ink-mute); margin-bottom: 8px; }
.progress-top b { color: var(--teal); font-size: 16px; }
.progress-bar { height: 7px; background: #E6EDEA; border-radius: 999px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; border-radius: 999px; background: var(--grad-bi); transition: width .34s cubic-bezier(.4, 0, .2, 1); }
.stage { padding: 14px 0 0; }
.phase { display: inline-flex; align-items: center; gap: 6px; background: var(--grad-bi-soft); border: 1px solid #DCEDE4; color: var(--teal); border-radius: 999px; padding: 5px 13px; font-size: 14px; font-weight: 900; margin-bottom: 14px; }
.q-text { font-size: 26px; font-weight: 900; line-height: 1.44; letter-spacing: -.6px; margin: 0 0 6px; color: var(--ink); }
.q-desc { font-size: 15.5px; color: var(--ink-mute); margin: 0 0 22px; }
.scale { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 13px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; padding: 14px 16px; text-align: left; transition: all .13s; }
.opt:hover { border-color: #BFD8D2; background: #FCFEFD; }
.opt:active { transform: scale(.99); }
.opt .num { flex: 0 0 36px; height: 36px; border-radius: 50%; border: 2px solid #D5DFDC; color: var(--ink-mute); display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 900; transition: all .13s; }
.opt .lb { font-size: 17.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: -.2px; }
.opt[aria-pressed="true"] { border-color: var(--teal); background: #F0F9F7; box-shadow: 0 3px 14px rgba(14, 124, 119, .13); }
.opt[aria-pressed="true"] .num { background: var(--grad-bi); border-color: transparent; color: #fff; }
.opt[aria-pressed="true"] .lb { color: var(--teal-deep); font-weight: 900; }

.loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 70px 20px; text-align: center; color: var(--ink-mute); font-size: 16px; font-weight: 600; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--teal); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.res-hero { position: relative; overflow: hidden; background: var(--grad-dark); border-radius: 22px; padding: 24px 22px; color: #fff; margin: 14px 0 13px; box-shadow: var(--sh-lg); }
.res-hero::before { content: ""; position: absolute; right: -60px; top: -70px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(124, 194, 66, .5) 0%, rgba(124, 194, 66, 0) 70%); }
.res-hero > * { position: relative; z-index: 1; }
.res-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; font-weight: 900; letter-spacing: .1em; opacity: .8; }
.res-top span:last-child { letter-spacing: 0; font-weight: 600; opacity: .8; }
.res-hero .kind { font-size: 16px; font-weight: 800; opacity: .9; margin-bottom: 4px; }
.res-hero h2 { font-size: 42px; font-weight: 900; line-height: 1.15; letter-spacing: -1.2px; margin: 0 0 6px; }
.res-hero h2 em { background: linear-gradient(120deg, #fff 0%, var(--accent, #A5D34A) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.res-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.res-icon { flex: none; width: 70px; height: 70px; border-radius: 22px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .32); display: grid; place-items: center; font-size: 38px; line-height: 1; box-shadow: 0 10px 26px rgba(0, 0, 0, .2); }
.hook { margin-top: 16px; display: flex; align-items: center; gap: 12px; background: var(--hot); color: #fff; border-radius: 14px; padding: 12px 15px; font-size: 16px; font-weight: 900; line-height: 1.35; box-shadow: 0 8px 20px rgba(242, 107, 58, .35); }
.hook .n { flex: none; min-width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; font-size: 22px; }
.res-hero .one { font-size: 15.5px; opacity: .84; margin: 0 0 16px; line-height: 1.5; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .24); border-radius: 999px; padding: 6px 13px; font-size: 14.5px; font-weight: 800; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent, var(--lime)); }
.axis { margin-top: 16px; }
.axis-labels { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 900; margin-bottom: 5px; }
.axis-labels .pct { font-size: 12.5px; color: var(--teal-deep); background: var(--accent, var(--lime)); border-radius: 999px; padding: 1px 8px; }
.axis-track { position: relative; height: 7px; background: rgba(255, 255, 255, .18); border-radius: 999px; }
.axis-note { margin: 9px 0 0; font-size: 14px; line-height: 1.5; opacity: .92; }
.axis-note b { font-weight: 900; }
.axis-track span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, rgba(255, 255, 255, .5), var(--accent, var(--lime))); }

.course-box { background: linear-gradient(150deg, #F2FAF7 0%, #F7FCF3 100%); border: 1.5px solid #D9EDE3; border-radius: 16px; padding: 16px; }
.course-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.badge { background: var(--grad-bi); color: #fff; border-radius: 999px; padding: 6px 16px; font-size: 15.5px; font-weight: 900; letter-spacing: -.2px; box-shadow: 0 4px 12px rgba(14, 124, 119, .28); }
.badge-soft { background: #fff; border: 1px solid #DCEDE4; color: var(--teal-deep); border-radius: 999px; padding: 5px 13px; font-size: 14.5px; font-weight: 900; }
.course-desc { font-size: 15.5px; color: var(--ink-soft); margin: 0 0 10px; }
.reasons { display: flex; flex-direction: column; gap: 5px; }
.reason { display: flex; align-items: flex-start; gap: 7px; font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; background: rgba(255, 255, 255, .7); border-radius: 9px; padding: 8px 11px; }
.reason::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-top: 6px; }

.reco { display: flex; flex-direction: column; gap: 8px; }
.reco-row { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: start; background: rgba(255, 255, 255, .7); border-radius: 9px; padding: 9px 11px; }
.reco-k { font-size: 14px; font-weight: 900; color: var(--teal); padding-top: 2px; }
.reco-v { font-size: 15.5px; font-weight: 800; color: var(--ink); line-height: 1.5; display: flex; flex-direction: column; gap: 2px; }
.reco-v.tip { font-weight: 600; color: var(--ink-soft); }
.reco-v small { font-size: 14px; font-weight: 600; color: var(--ink-mute); }
.locked { position: relative; overflow: hidden; }
.locked .blur { filter: blur(6px); opacity: .6; pointer-events: none; user-select: none; display: grid; gap: 12px; padding: 10px 0 4px; }
.locked .blur div { height: 18px; border-radius: 7px; background: var(--grad-bi); opacity: .5; }
.locked .over { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; display: grid; place-content: center; gap: 5px; text-align: center; padding: 16px; }
.locked .over b { font-size: 17.5px; color: var(--teal-deep); }
.locked .over span { font-size: 15px; color: var(--ink-soft); }

.actions { display: flex; flex-direction: column; gap: 9px; }
.actions .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.note { margin: 0; font-size: 14.5px; color: var(--ink-mute); text-align: center; line-height: 1.55; }

.form { display: flex; flex-direction: column; gap: 11px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 15px; font-weight: 800; color: var(--ink-soft); }
.input { width: 100%; border: 1.5px solid var(--line); border-radius: 13px; padding: 14px; font-size: 18px; background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.input::placeholder { color: #B5BFC2; }
.input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3.5px rgba(14, 124, 119, .1); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-width: 56px; border: 1.5px solid var(--line); border-radius: 11px; padding: 11px 4px; background: #fff; font-size: 15.5px; font-weight: 800; color: var(--ink-soft); text-align: center; transition: all .13s; }
.seg button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal); color: #fff; box-shadow: 0 4px 12px rgba(14, 124, 119, .26); }
.consent { padding: 12px 14px; border-radius: 12px; background: #F7FAF9; border: 1px solid var(--line-soft); font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; }
.consent summary { cursor: pointer; font-weight: 800; color: var(--teal-deep); }
.consent ul { margin: 8px 0 0; padding-left: 16px; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 16px; font-weight: 700; color: var(--ink); }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--teal); flex: none; }
.err { margin: 0; font-size: 15.5px; font-weight: 800; color: #B23A2A; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); padding: 11px 18px; border-radius: 999px; background: rgba(46, 50, 51, .92); color: #fff; font-size: 16px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); }
/* 보조 글씨도 회색 대신 검정으로 진하고 굵게 (사용자 요청) */
.card-sub, .hint, .q-desc, .value p, .reco-v.tip, .reco-v small, .course-desc, .reason, .note, .foot, .consent, .consent summary, .field label, .field .lbl, .opt .lb, .opt .num, .brand .sys, .progress-top, .loading, .locked .over span, .badge-soft { color: var(--ink); font-weight: 700; }
.value p b, .reco-v, .card-head, .q-text, .opt[aria-pressed="true"] .lb { font-weight: 900; }
.hint::before { border-width: 2px; }
.sechead { margin: 22px 0 10px; display: flex; flex-direction: column; gap: 8px; }
.sechead h3 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.5px; line-height: 1.3; }
.kicker.dark { background: var(--grad-bi); border: 0; color: #fff; margin: 0; align-self: flex-start; }
.gapcard { border-color: #F0E4B8; background: linear-gradient(160deg, #FFFDF3 0%, #fff 60%); }
.gap { padding: 12px 0 4px; border-top: 1px solid var(--line-soft); }
.gap:first-of-type { border-top: 0; }
.basis { margin: 14px 0 0; font-size: 13px; line-height: 1.5; opacity: .9; }
.why { margin: 6px 0 0; font-size: 15px; line-height: 1.5; font-weight: 700; }
.why.strong { color: var(--teal-deep); }
.steps { margin: 10px 0 4px; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.steps li { counter-increment: s; position: relative; padding: 8px 12px 8px 40px; border-radius: 12px; background: rgba(255, 255, 255, .8); border: 1px solid #F0E4B8; font-size: 15px; line-height: 1.55; font-weight: 700; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--grad-bi); color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; }
.subjlist { display: flex; flex-direction: column; gap: 10px; }
.subj { padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; }
.subj.weak { border-color: #D9EDE3; background: linear-gradient(150deg, #F2FAF7 0%, #F7FCF3 100%); }
/* 차트: 한 가지 청록 색조, 글자는 글자색 토큰, 격자는 연하게 */
.chart { width: 100%; height: auto; display: block; margin: 6px 0 4px; }
.chart .ring, .chart .spoke { fill: none; stroke: var(--line); stroke-width: 1; }
.chart .ring { fill: rgba(14, 124, 119, .03); }
.chart .area { fill: rgba(14, 124, 119, .22); stroke: var(--teal); stroke-width: 2; stroke-linejoin: round; }
.chart .dot { fill: var(--teal); stroke: #fff; stroke-width: 2; }
.chart .dot.na { fill: #fff; stroke: var(--teal); stroke-dasharray: 2 2; }
.chart .lbl { font-size: 12px; font-weight: 800; fill: var(--ink); }
.chart .val { font-size: 11px; font-weight: 700; fill: var(--ink); opacity: .85; }
.chart .track { fill: #E6EDEA; }
.chart .bar { fill: var(--teal); }
.chart .bar.na { fill: #C9D6D2; }
.bars .lbl { font-size: 12px; }
/* 후킹 강조색(주황): 완전히 새로 공부할 범위, 가장 큰 빈틈 */
.chart .bar.full { fill: var(--hot); }
.badge-soft.hot { background: var(--hot); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(242, 107, 58, .3); }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><b>ETOOS</b><span>247</span></div>
      <div class="sys">이투스247학원<b>LMCT 학습진단</b></div>
    </div>
    <button class="back" id="back" type="button" hidden>이전</button>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {

    var agree = h('input', { type: 'checkbox', id: 'f-agree' });
    var err = h('p', { class: 'err', role: 'alert', hidden: '' });
    var submit = h('button', { class: 'btn btn-primary', type: 'submit' }, '상담 신청하기 →');

    phone.addEventListener('input', function () {
      var d = phone.value.replace(/\D/g, '').slice(0, 11);
      phone.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
    });

    var form = h('form', { class: 'form', novalidate: '', on: { submit: function (ev) {
      ev.preventDefault();
      var digits = phone.value.replace(/\D/g, '');
      var msg = !name.value.trim() ? '이름을 적어 주세요.'
        : !/^01[016789]\d{7,8}$/.test(digits) ? '휴대폰 번호를 확인해 주세요.'
        : !branch.value ? '희망 지점을 골라 주세요.'
        : !agree.checked ? '개인정보 수집과 이용에 동의해 주세요.' : '';
      if (msg) { err.textContent = msg; err.hidden = false; postHeight(); return; }
      submit.disabled = true;
      log('lead', { name: name.value.trim(), phone: digits, branch: branch.value, region: BRANCH_REGION[branch.value] || BRANCH_UNKNOWN, mode: mode || '아직 모름', consent: true, type: result.type, course: '' });
      leadSent = true;
      renderThanks();
    } } },
      h('div', { class: 'field' }, h('label', { for: 'f-name' }, '이름'), name),
      h('div', { class: 'field' }, h('label', { for: 'f-phone' }, '휴대폰 번호'), phone),
      h('div', { class: 'field' }, h('label', { for: 'f-branch' }, '희망 지점'), branch),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, '희망 형태'), h('div', { class: 'seg' }, segBtns)),
      h('details', { class: 'consent' },
        h('summary', null, '개인정보 수집과 이용 안내 (필수)'),
        h('ul', null,
          h('li', null, '수집 항목: 이름, 휴대폰 번호, 희망 지점과 형태, 진단 응답'),
          h('li', null, '목적: 학습 상담 연락과 정밀진단 안내'),
          h('li', null, '보유 기간: 상담 완료 후 1년, 이후 파기'),
          h('li', null, '동의하지 않을 수 있으며, 이 경우 상담 신청이 어려워요.'))),
      h('label', { class: 'check', for: 'f-agree' }, agree, '개인정보 수집과 이용에 동의합니다.'),
      err,
      submit);

    show(h('section', { class: 'screen' },
      h('div', { class: 'card', style: 'margin-top:14px' },
        h('span', { class: 'phase' }, TYPES[result.type].name),
        h('h2', { class: 'card-head', style: 'font-size:21px' }, '무료 상담 신청'),
        h('p', { class: 'card-sub' }, '가까운 이투스247학원에서 연락드려 2028 수능 공백에 맞는 정밀진단과 맞춤 코스를 안내해 드려요.'),
        form)
    ));
  }

  function renderThanks() {
    backBtn.hidden = true;
    step = QUESTIONS.length + 2;
    show(h('section', { class: 'screen' },
      h('div', { class: 'card', style: 'margin-top:14px' },
        h('span', { class: 'phase' }, '신청 완료'),
        h('h2', { class: 'card-head', style: 'font-size:21px' }, '상담 신청이 접수됐어요'),
        h('p', { class: 'card-sub' }, '영업일 기준 1~2일 안에 연락드릴게요. 그동안 이투스247학원을 둘러보세요.'),
        h('div', { class: 'actions' },
          h('a', { class: 'btn btn-primary', href: HOME_URL, target: '_top', rel: 'noopener', on: { click: function () { log('cta', { value: 'home' }); } } }, '이투스247 홈으로'),
          h('button', { class: 'btn btn-ghost', type: 'button', on: { click: renderResult } }, '내 결과 다시 보기')))
    ));
  }

  window.addEventListener('resize', postHeight);
  window.LMCTLite = { score: score, gaps: gaps, gradeBucket: gradeBucket, QUESTIONS: QUESTIONS, TYPES: TYPES, UNITS: UNITS, GAPS: GAPS };
  log('view');
  renderIntro();
})();
</script>
</body>
</html>
